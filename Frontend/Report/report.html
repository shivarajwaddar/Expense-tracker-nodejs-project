<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendWise | Detailed Reports</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="report.css" />
  </head>
  <body class="bg-light">
    <nav
      class="navbar bg-white shadow-sm px-4 d-flex justify-content-between sticky-top"
    >
      <h4 class="fw-bold text-primary m-0">
        <i class="bi bi-wallet2 me-2"></i>Expense Tracker
      </h4>
      <div class="d-flex gap-2">
        <a
          href="../Expenses/expense-tracker.html"
          class="btn btn-outline-primary btn-sm fw-bold"
        >
          <i class="bi bi-house me-1"></i> Dashboard
        </a>
      </div>
    </nav>

    <div id="reportsPage" class="container mt-4">
      <div class="card shadow-sm border-0 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="text-start">
            <h3 class="text-primary fw-bold m-0">Detailed Reports</h3>
            <p class="text-muted small">Viewing your transaction history</p>
          </div>
          <button id="downloadReportBtn" class="btn btn-success btn-sm fw-bold">
            <i class="bi bi-file-earmark-spreadsheet me-1"></i> Download File
          </button>
        </div>

        <div class="row mb-4 justify-content-center">
          <div class="col-md-6 text-center">
            <div class="btn-group w-100" role="group">
              <input
                type="radio"
                class="btn-check"
                name="v-report"
                id="dailyReport"
                checked
              />
              <label class="btn btn-outline-primary" for="dailyReport"
                >Daily</label
              >

              <input
                type="radio"
                class="btn-check"
                name="v-report"
                id="weeklyReport"
              />
              <label class="btn btn-outline-primary" for="weeklyReport"
                >Weekly</label
              >

              <input
                type="radio"
                class="btn-check"
                name="v-report"
                id="monthlyReport"
              />
              <label class="btn btn-outline-primary" for="monthlyReport"
                >Monthly</label
              >
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-dark">
              <tr class="text-center">
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Income (₹)</th>
                <th>Expense (₹)</th>
              </tr>
            </thead>
            <tbody id="reportTableBody" class="text-center"></tbody>
            <tfoot
              id="reportTableFooter"
              class="table-light fw-bold text-center"
            ></tfoot>
          </table>
        </div>

        <nav aria-label="Report pagination" class="mt-4">
          <ul
            id="reportPagination"
            class="pagination pagination-sm justify-content-center"
          ></ul>
        </nav>
      </div>
    </div>
    <div class="card shadow-sm border-0 p-4 mt-4">
      <div class="text-start mb-3">
        <h3 class="text-primary fw-bold m-0">Download History</h3>
        <p class="text-muted small">Access your previously generated reports</p>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-dark">
            <tr class="text-center">
              <th>Date Created</th>
              <th>File Name</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="downloadHistoryTableBody" class="text-center"></tbody>
        </table>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="report.js"></script>
  </body>
</html>
